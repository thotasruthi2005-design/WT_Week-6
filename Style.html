
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>CSS Example</title>

    <style>
        body {
            background-color: lightcyan;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: darkblue;
            font-family: 'Courier New', Courier, monospace;
        }

        h2 {
            color: green;
        }

        h3 {
            color: purple;
        }

        p {
            color: black;
            font-size: 18px;
        }

        b {
            color: red;
        }

        i {
            color: blue;
        }

        hr {
            border: 2px solid darkblue;
        }

        ul {
            text-align: left;
            color: darkgreen;
        }

        ol {
            text-align: left;
            color: darkred;
        }

        li {
            margin: 5px;
        }

        a {
            color: blue;
            font-size: 18px;
            text-decoration: none;
        }

        a:hover {
            color: red;
            text-decoration: underline;
        }

        div {
            background-color: white;
            margin: 20px;
            padding: 15px;
            border: 2px solid black;
        }

        div h3 {
            color: darkblue;
        }

        button {
            background-color: darkblue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: green;
        }
    </style>
</head>

<body>

   

    <h2>CSS Example</h2>

    <h3>Introduction</h3>

    <p>
        This is a <b>simple HTML page</b> with
        <i>CSS styling</i>.
    </p>

    <hr>

    <div>
        <h3>My Subjects</h3>

        <ul>
            <li>Web Technology</li>
            <li>Python</li>
            <li>TEC</li>
        </ul>

    

        <br>

        <a href="#">Visit Website</a>

        <br><br>

       
    </div>

</body>

</html>
